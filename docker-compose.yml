services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-parse
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle          # senha do SYS/SYSTEM
      APP_USER: aula                   # usuário da aplicação (criado no FREEPDB1)
      APP_USER_PASSWORD: aula
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  oracle-data:
